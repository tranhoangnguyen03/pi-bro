<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="color-scheme" content="light dark">
<title>__TITLE__ — Architecture</title>
<!-- bro-architecture-sha256:__SHA__ -->
<style>
:root{color-scheme:light dark;font:15px system-ui,-apple-system,sans-serif;--bg:#f3f6f9;--paper:#fff;--text:#1d2b39;--dim:#526477;--line:#a5b6c5;--focus:#1775ac;--soft:#e9f0f6;--selected:#d8ebfa}
@media(prefers-color-scheme:dark){:root{--bg:#111921;--paper:#1c2a37;--text:#edf3f8;--dim:#b4c3d2;--line:#556a7a;--focus:#78cbed;--soft:#243847;--selected:#294c64}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}header{background:var(--paper);padding:1rem 1.3rem;border-bottom:1px solid var(--line)}h1{font-size:1.55rem;margin:.1rem 0 .45rem}header p{margin:.4rem 0;max-width:75rem;line-height:1.5;color:var(--dim)}.revision{font-size:.8rem;color:var(--dim)}.controls{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;padding:.7rem 1rem;background:var(--soft);border-bottom:1px solid var(--line)}input,select,button{font:inherit;background:var(--paper);color:var(--text);border:1px solid var(--line);border-radius:.45rem;padding:.4rem .65rem}input{width:12rem;max-width:25rem;flex:1}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,.node:focus{outline:2px solid var(--focus);outline-offset:2px}
main{display:grid;grid-template-columns:minmax(0,1fr) minmax(17rem,22rem);min-height:55vh}.canvas{overflow:auto;max-height:76vh;padding:1rem;min-width:0}svg{background:var(--paper);border:1px solid var(--line);border-radius:.65rem;display:block}.edge{fill:none;stroke:var(--line);stroke-width:2}.edge.chosen{stroke:var(--focus);stroke-width:3.5}.dim{opacity:.17}.node{cursor:pointer}.node rect{fill:var(--soft);stroke:var(--line);stroke-width:1.5}.node text{fill:var(--text);pointer-events:none;font-size:14px}.node .kind{fill:var(--dim);font-size:11px}.node.chosen rect{fill:var(--selected);stroke:var(--focus);stroke-width:3}aside{background:var(--paper);padding:1rem 1.3rem;overflow-wrap:anywhere;border-left:1px solid var(--line)}aside p{line-height:1.5}aside a{color:var(--focus)}aside h2{font-size:1.2rem;margin-top:.2rem}small,.status{color:var(--dim)}.status{padding:.5rem 1rem;font-size:.85rem}.legend{display:flex;gap:1.2rem;flex-wrap:wrap}noscript{display:block;padding:1rem} 
@media(max-width:850px){main{display:block}.canvas{max-height:55vh}aside{border-left:0;border-top:1px solid var(--line)}} 
</style>
</head>
<body>
<header><h1>__TITLE__</h1><p>__SUMMARY__</p><div class="revision">Source: __REVISION__</div></header>
<div class="controls">
<label for="search">Find</label><input id="search" placeholder="Search components" autocomplete="off">
<label for="flow">Trace a flow</label><select id="flow"><option value="">All parts</option></select>
<button id="clear">Clear</button><button id="fit">Fit map</button>
<button id="zoom-in" aria-label="Zoom in">Zoom +</button><button id="zoom-out" aria-label="Zoom out">Zoom −</button>
</div>
<div class="status" id="status" role="status">Select a component to see its sources and relationships.</div>
<main><div class="canvas" id="canvas"><svg id="diagram" role="img" aria-label="Architecture component map"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8z" fill="var(--line)"></path></marker></defs><g id="edge-layer"></g><g id="node-layer"></g></svg></div><aside id="details" aria-live="polite"><h2>Architecture overview</h2><p>Select a part or a flow to explore.</p></aside></main>
<noscript><h2>Architecture components</h2>__NOSCRIPT__</noscript>
<script id="graph-data" type="application/json">__DATA__</script>
<script>
(() => {
'use strict';
const graph=JSON.parse(document.getElementById('graph-data').textContent);
const nodes=graph.nodes,edges=graph.edges,flows=graph.flows||[];
const byId=new Map(nodes.map(n=>[n.id,n]));
const NS='http://www.w3.org/2000/svg',svg=document.getElementById('diagram');
const nodeLayer=document.getElementById('node-layer'),edgeLayer=document.getElementById('edge-layer');
const details=document.getElementById('details'),status=document.getElementById('status');
const search=document.getElementById('search'),flowPicker=document.getElementById('flow');
function svgEl(tag,attributes){const el=document.createElementNS(NS,tag);for(const [k,v] of Object.entries(attributes||{}))el.setAttribute(k,String(v));return el;}
function el(tag,parent,text){const node=document.createElement(tag);if(text!==undefined)node.textContent=text;parent.appendChild(node);return node;}
function anchor(parent,label,href){const a=el('a',parent,label);a.href=href;return a;}
const successors=new Map(nodes.map(n=>[n.id,[]])),degree=new Map(nodes.map(n=>[n.id,0]));
for(const e of edges){successors.get(e.from).push(e.to);degree.set(e.to,degree.get(e.to)+1);}
const rank=new Map(nodes.map(n=>[n.id,0])),queue=nodes.filter(n=>degree.get(n.id)===0).map(n=>n.id).sort();
for(let i=0;i<queue.length;i++){const id=queue[i];for(const next of successors.get(id)){rank.set(next,Math.max(rank.get(next),Math.min(8,rank.get(id)+1)));degree.set(next,degree.get(next)-1);if(degree.get(next)===0)queue.push(next);}}
const seen=new Set(queue),last=Math.max(0,...rank.values());for(const n of nodes)if(!seen.has(n.id))rank.set(n.id,Math.min(8,last+1));
const columns=new Map();for(const n of nodes){const k=rank.get(n.id);if(!columns.has(k))columns.set(k,[]);columns.get(k).push(n);}for(const list of columns.values())list.sort((a,b)=>a.label.localeCompare(b.label));
const W=224,H=80,DX=296,DY=124,P=52,pos=new Map();
for(const [column,list] of columns)list.forEach((n,index)=>pos.set(n.id,{x:P+column*DX,y:P+index*DY}));
const width=P*2+Math.max(...columns.keys(),0)*DX+W;
const height=P*2+Math.max(1,...[...columns.values()].map(x=>x.length))*DY;
let zoom=1;svg.setAttribute('viewBox','0 0 '+width+' '+height);
function setZoom(z){zoom=Math.max(.2,Math.min(2.5,z));svg.setAttribute('width',Math.round(width*zoom));svg.setAttribute('height',Math.round(height*zoom));}
setZoom(1);
const nodeViews=new Map(),edgeViews=[];
for(const e of edges){
const a=pos.get(e.from),b=pos.get(e.to),x=a.x+W,y=a.y+H/2,x2=b.x,y2=b.y+H/2,mid=Math.max(25,Math.abs(x2-x)*.4);
const path=svgEl('path',{d:'M'+x+' '+y+' C'+(x+mid)+' '+y+','+(x2-mid)+' '+y2+','+x2+' '+y2,class:'edge','marker-end':'url(#arrow)'});
edgeLayer.appendChild(path);const label=svgEl('text',{x:(x+x2)/2,y:(y+y2)/2-8,'text-anchor':'middle','font-size':11,fill:'var(--dim)'});
label.textContent=e.label.length>36?e.label.slice(0,34)+'…':e.label;edgeLayer.appendChild(label);edgeViews.push({edge:e,path,label});
}
for(const n of nodes){
const p=pos.get(n.id),g=svgEl('g',{class:'node',transform:'translate('+p.x+','+p.y+')',role:'button',tabindex:0,'aria-label':n.label+': '+n.description});
g.appendChild(svgEl('rect',{width:W,height:H,rx:9}));
const name=svgEl('text',{x:12,y:29,'font-weight':650});name.textContent=n.label.length>28?n.label.slice(0,27)+'…':n.label;g.appendChild(name);
const type=svgEl('text',{x:12,y:53,class:'kind'});type.textContent=n.kind||'component';g.appendChild(type);
nodeLayer.appendChild(g);nodeViews.set(n.id,g);
g.addEventListener('click',()=>select(n.id));g.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();select(n.id);}});
}
function mark(keep){for(const [id,n] of nodeViews){n.classList.toggle('dim',!!keep&&!keep.has(id));n.classList.toggle('chosen',!!keep&&keep.has(id));}for(const item of edgeViews){const on=!!keep&&keep.has(item.edge.from)&&keep.has(item.edge.to);item.path.classList.toggle('dim',!!keep&&!on);item.path.classList.toggle('chosen',on);item.label.style.opacity=keep&&!on?'.2':'1';}}
function overview(){details.replaceChildren();el('h2',details,graph.project.name);el('p',details,graph.project.summary);el('small',details,nodes.length+' components · '+edges.length+' relationships · '+flows.length+' flows');}
function select(id){
const n=byId.get(id);if(!n)return;details.replaceChildren();el('h2',details,n.label);el('p',details,n.description);el('small',details,n.kind||'component');
if(n.doc){const p=el('p',details);anchor(p,'Read the related guide',n.doc.split('/').map(encodeURIComponent).join('/'));}
if(n.sources&&n.sources.length){el('h3',details,'Source files');const ul=el('ul',details);for(const src of n.sources){const li=el('li',ul);anchor(li,src,'../../'+src.split('/').map(encodeURIComponent).join('/'));}}
const touches=edges.filter(e=>e.from===id||e.to===id);if(touches.length){el('h3',details,'Connections');const ul=el('ul',details);for(const e of touches)el('li',ul,byId.get(e.from).label+' → '+byId.get(e.to).label+': '+e.label);}
flowPicker.value='';search.value='';status.textContent='Selected: '+n.label;mark(new Set([id,...touches.flatMap(e=>[e.from,e.to])]));
}
for(const f of flows){const opt=el('option',flowPicker,f.label);opt.value=f.id;}
flowPicker.addEventListener('change',()=>{const f=flows.find(item=>item.id===flowPicker.value);if(!f){clear();return;}search.value='';details.replaceChildren();el('h2',details,f.label);const ol=el('ol',details);for(const id of f.steps)el('li',ol,byId.get(id).label);status.textContent='Flow: '+f.label;mark(new Set(f.steps));});
function clear(){search.value='';flowPicker.value='';overview();status.textContent='Select a component to see its sources and relationships.';mark(null);}
search.addEventListener('input',()=>{const q=search.value.toLowerCase().trim();flowPicker.value='';if(!q){clear();return;}const matches=nodes.filter(n=>(n.label+' '+n.description+' '+(n.kind||'')).toLowerCase().includes(q));const ids=new Set(matches.map(n=>n.id));details.replaceChildren();el('h2',details,'Search results');const ul=el('ul',details);for(const n of matches){const li=el('li',ul);const button=el('button',li,n.label);button.addEventListener('click',()=>select(n.id));}status.textContent=matches.length+' matches';mark(ids);});
document.getElementById('clear').addEventListener('click',clear);
document.getElementById('fit').addEventListener('click',()=>setZoom(Math.min(1,(document.getElementById('canvas').clientWidth-36)/width)));
document.getElementById('zoom-in').addEventListener('click',()=>setZoom(zoom*1.2));
document.getElementById('zoom-out').addEventListener('click',()=>setZoom(zoom/1.2));
overview();
})();
</script>
</body>
</html>
