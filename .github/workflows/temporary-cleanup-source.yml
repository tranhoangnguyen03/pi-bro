name: Temporary cleanup source bundle
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/temporary-cleanup-source.yml']
permissions:
  contents: read
jobs:
  bundle:
    if: github.event.pull_request.number == 176
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Export merge candidate and target
        run: |
          git archive --format=tar HEAD | gzip -1 > "$RUNNER_TEMP/merged-pr.tar.gz"
          git archive --format=tar origin/main | gzip -1 > "$RUNNER_TEMP/main.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: pi-bro-merged-audit-source
          path: |
            ${{ runner.temp }}/merged-pr.tar.gz
            ${{ runner.temp }}/main.tar.gz
          retention-days: 1
