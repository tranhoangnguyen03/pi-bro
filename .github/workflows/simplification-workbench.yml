name: Disposable simplification workbench
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/simplification-workbench.yml']
permissions:
  contents: read
jobs:
  prepare:
    if: github.event.pull_request.number == 176
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Bundle public source, locked dependencies and Node for offline audit
        run: |
          mkdir -p workbench/node-bin
          cp "$(command -v node)" workbench/node-bin/node
          git archive --format=tar ff6b260b10be8889809d4ea02108aceb826e4668 > workbench/baseline.tar
          git archive --format=tar HEAD > workbench/head.tar
          tar -czf workbench/dependencies.tar.gz node_modules
          tar -czf workbench/node.tar.gz -C workbench node-bin
          rm -r workbench/node-bin
      - uses: actions/upload-artifact@v4
        with:
          name: pi-bro-offline-workbench
          path: workbench/*
          retention-days: 2
          compression-level: 0
