name: Temporary test-audit workbench
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/simplification-audit-workbench.yml']
permissions:
  contents: read
jobs:
  bundle:
    if: github.event.pull_request.number == 176
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Create exact PR source snapshot
        run: tar --exclude=.git --exclude=node_modules -czf "$RUNNER_TEMP/pi-bro-pr.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: pi-bro-test-audit-source
          path: ${{ runner.temp }}/pi-bro-pr.tar.gz
          retention-days: 1
