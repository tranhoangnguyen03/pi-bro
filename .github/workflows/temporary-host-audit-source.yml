name: Temporary host audit source
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/temporary-host-audit-source.yml']
permissions:
  contents: read
jobs:
  bundle:
    if: github.event.pull_request.number == 176
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Package the exact PR snapshot
        run: tar -czf "$RUNNER_TEMP/pi-bro-current.tar.gz" --exclude=.git --exclude=node_modules .
      - uses: actions/upload-artifact@v4
        with:
          name: pi-bro-host-audit-source
          path: ${{ runner.temp }}/pi-bro-current.tar.gz
          retention-days: 1
