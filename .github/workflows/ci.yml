name: ci

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  pig:
    uses: ./.github/workflows/pig.yml
  # The main test job runs on the newest Node; these cover the engines floor and macOS.
  compat:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: 22.19.0 }
          - { os: macos-latest, node: 24 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Run the supported Pi floor here, not in a second identical Linux job.
      # The compatibility matrix still checks the package's normal dependency set.
      - name: Install minimum supported Pi
        run: npm install --no-save @earendil-works/pi-coding-agent@1.3.0 @earendil-works/pi-tui@1.3.0 typebox@1.3.27
      - run: npm test
      - name: Recompute synthetic reader benchmark (offline)
        run: node benchmark/recompute-reader.ts
      - name: Release metadata
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          node .github/scripts/release-utils.mjs selftest
          node .github/scripts/release-utils.mjs validate

  codex-subscription-route:
    # Actual Codex CLI 0.165.0 with a fake local ChatGPT login and local HTTP server.
    # Default profiles must pass; custom provider/URL requests must be rejected
    # without startup model-discovery GETs or inference POSTs.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.15.0'
          cache: npm
      - run: npm ci
      - name: Install pinned official Codex CLI
        run: npm install --no-save --ignore-scripts --no-audit --no-fund @openai/codex@0.165.0
      - name: Verify real Codex binary
        run: ./node_modules/.bin/codex --version
      - name: Prove explicit subscription cannot use custom env-key provider
        run: BRO_REAL_CODEX_BIN="$PWD/node_modules/.bin/codex" node --experimental-transform-types --test test/codex-subscription-real.test.mjs
