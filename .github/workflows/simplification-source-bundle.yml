name: Temporary source bundle for exhaustive cleanup
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/simplification-source-bundle.yml']
permissions:
  contents: read
jobs:
  bundle:
    if: github.event.pull_request.number == 176
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bundle repository tree
        run: git archive --format=tar HEAD | gzip -1 > pi-bro-current.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: pi-bro-current-source
          path: pi-bro-current.tar.gz
          retention-days: 1
