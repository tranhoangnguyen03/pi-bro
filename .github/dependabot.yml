version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    labels: [release:none]
  # Monthly and grouped to keep the PR count low for one maintainer. No release
  # label: you decide per PR whether runtime bumps need a release or release:none.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    # Pinned to the minimum Pi the README promises, so CI keeps testing it.
    ignore:
      - dependency-name: "@earendil-works/*"
      - dependency-name: typebox
    groups:
      runtime:
        dependency-type: production
      dev:
        dependency-type: development
