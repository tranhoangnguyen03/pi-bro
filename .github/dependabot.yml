version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    labels: [release:none]
  # Monthly and grouped to keep the PR count low for one maintainer. No release
  # label: you decide per PR whether runtime bumps need a release or release:none.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    # Pi is pinned to the newest version Bro is verified on; upgrade it deliberately
    # and update the README's "tested on" note (CI's pi-floor job covers the oldest).
    ignore:
      - dependency-name: "@earendil-works/*"
      - dependency-name: typebox
      # Major bumps of these break the build; upgrade them deliberately.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      runtime:
        dependency-type: production
      dev:
        dependency-type: development
