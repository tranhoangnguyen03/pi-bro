version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    labels: [release:none]
  # Monthly and grouped to keep the PR count low for one maintainer. Runtime
  # dependency bumps ship with the next release; merging still needs a human.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      npm:
        patterns: ["*"]
    labels: [release:none]
